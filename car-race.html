<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14123a">
<title>Car Race | Playora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14123a;--panel:#211e55;--line:#ffffff22;--text:#f6f3ff;--muted:#b3afe0;--hot:#ff5a36;--go:#35e08c;--gold:#ffc21a;
--disp:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;font-family:var(--disp);text-shadow:0 2px 6px #0007}
#hud .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pos{font-size:54px;font-weight:800;line-height:.9;font-style:italic}
.pos span{font-size:22px;opacity:.8;margin-left:2px}
.mid{text-align:center;font-weight:800;font-size:18px;line-height:1.25;padding-top:4px}
.mid span{display:block;font-size:15px;font-weight:600;opacity:.9}
#pz{pointer-events:auto;width:46px;height:46px;border-radius:50%;background:#0006;border:2px solid #fff5;font-weight:800;font-size:16px;letter-spacing:2px}
#hc{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 72px);font-size:17px;font-weight:800;background:#0005;border-radius:20px;padding:3px 12px}
.spd{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 66px);text-align:right;font-weight:800;font-size:38px;font-style:italic;line-height:1}
.spd small{font-size:13px;font-style:normal;font-weight:600;opacity:.85;margin-left:4px}
.nit{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 112px);width:110px;height:9px;border-radius:5px;background:#0006;overflow:hidden;border:1px solid #fff5}
.nit i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2de2ff,#7b9bff);transition:width .1s}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,#ff2a2a 130%);opacity:0;transition:opacity .25s}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--disp);font-weight:800;font-style:italic;font-size:min(34vw,170px);text-shadow:0 6px 24px #000a;color:#fff}
#big.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.7);opacity:0}25%{opacity:1}100%{transform:scale(.9);opacity:.15}}

/* touch controls */
#ctl{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 140px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 16px);touch-action:none}
#ctl .grp{display:flex;gap:10px;align-items:flex-end}
.pad{touch-action:none;width:74px;height:74px;border-radius:24px;background:#ffffff1f;border:2px solid #ffffff55;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.pad.on{background:#ffffff55}
.pad svg{width:38px;height:38px}
.pad.brake{width:64px;height:64px;border-radius:50%;font-family:var(--disp);font-weight:800;font-size:14px}
.pad.nitro{width:86px;height:86px;border-radius:50%;background:#2de2ff33;border-color:#2de2ff;font-family:var(--disp);font-weight:800;font-size:16px;color:#cffaff}
.pad.nitro.on{background:#2de2ffaa;color:#06232b}

/* menus */
.ov{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#14123acc,#14123af0 60%);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);touch-action:pan-y}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 6px}
.top h1{margin:0;font-family:var(--disp);font-weight:800;font-size:26px;font-style:italic}
.ib{min-width:44px;height:44px;border-radius:14px;background:#ffffff1a;border:1px solid var(--line);padding:0 14px;font-weight:700}
.coins{font-weight:800;background:#ffffff1a;border-radius:20px;padding:8px 14px;border:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 12px;-webkit-overflow-scrolling:touch}
h2{font-family:var(--disp);font-size:17px;margin:14px 0 8px;font-weight:800}
.tracks{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.trk{flex:0 0 78%;max-width:260px;scroll-snap-align:start;border-radius:18px;padding:12px;text-align:left;border:2px solid transparent;position:relative;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end}
.trk b{font-family:var(--disp);font-size:19px;font-weight:800;text-shadow:0 1px 4px #0008}
.trk span{font-size:13px;opacity:.95;text-shadow:0 1px 4px #0009}
.trk.sel{border-color:#fff;box-shadow:0 0 0 3px #ffffff33}
.garage{background:var(--panel);border-radius:20px;padding:12px;border:1px solid var(--line)}
.gv{display:flex;align-items:center;justify-content:space-between;gap:6px}
#cv{width:min(62vw,250px);height:auto;aspect-ratio:5/3.2}
.nav{width:44px;height:64px;border-radius:14px;background:#ffffff1a;font-size:26px;font-weight:800}
.gn{text-align:center;font-family:var(--disp);font-weight:800;font-size:20px;margin:2px 0 6px}
.stat{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:13px;margin:5px 4px;color:var(--muted)}
.stat i{display:block;height:8px;border-radius:5px;background:#ffffff1f;overflow:hidden}
.stat u{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold));border-radius:5px}
.btn{display:block;width:100%;min-height:52px;border-radius:16px;font-family:var(--disp);font-weight:800;font-size:19px;background:var(--hot);color:#fff;box-shadow:0 4px 0 #b3361b}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b3361b}
.btn.alt{background:#ffffff22;box-shadow:none;border:1px solid var(--line)}
.btn.buy{background:var(--gold);color:#2a1d00;box-shadow:0 4px 0 #b88a00;margin-top:8px}
.btn[disabled]{opacity:.5}
.tg{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:14px;padding:12px 14px;margin-top:8px;border:1px solid var(--line);width:100%;font-weight:600;text-align:left}
.tg em{font-style:normal;font-weight:800;color:var(--muted)}
.tg.on em{color:var(--go)}
.foot{padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(180deg,transparent,#14123a 40%)}
.card{margin:auto;width:min(92vw,380px);background:var(--panel);border-radius:24px;padding:20px;border:1px solid var(--line);text-align:center}
.card h1{font-family:var(--disp);font-size:34px;font-style:italic;margin:0 0 4px}
.card p{margin:4px 0;color:var(--muted)}
.card .big{font-family:var(--disp);font-weight:800;font-size:60px;font-style:italic;line-height:1}
.card .row{display:flex;gap:10px;margin-top:14px}
.rw{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed var(--line);font-weight:600}
</style></head>
<body>
<canvas id="c" aria-label="Car race view"></canvas>

<div id="hud" hidden>
 <div class="row">
  <div class="pos"><b id="hp">6</b><span id="hpn">/6</span></div>
  <div class="mid"><div id="hl">Lap 1/3</div><span id="ht">0:00.0</span></div>
  <button id="pz" aria-label="Pause">II</button>
 </div>
 <div id="hc">🪙 0</div>
 <div class="spd"><span id="hs">0</span><small>km/h</small></div>
 <div class="nit" aria-label="Nitro"><i id="hn"></i></div>
</div>
<div id="flash"></div>
<div id="big" hidden></div>

<div id="ctl" hidden>
 <div class="grp">
  <button class="pad" id="bl" aria-label="Steer left"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
  <button class="pad" id="br" aria-label="Steer right"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
 </div>
 <div class="grp">
  <button class="pad brake" id="bb">Brake</button>
  <button class="pad nitro" id="bn">Nitro</button>
 </div>
</div>

<!-- main menu -->
<div class="ov" id="menu" hidden>
 <div class="top"><button class="ib" id="back" aria-label="Back to Playora">‹ Back</button><h1>Car Race</h1><div class="coins" id="mc">🪙 0</div></div>
 <div class="scroll">
  <h2>Choose a track</h2>
  <div class="tracks" id="tracks"></div>
  <h2>Your garage</h2>
  <div class="garage">
   <div class="gv"><button class="nav" id="gp" aria-label="Previous car">‹</button><canvas id="cv" width="500" height="320"></canvas><button class="nav" id="gnx" aria-label="Next car">›</button></div>
   <div class="gn" id="gn"></div>
   <div class="stat"><span>Top speed</span><i><u id="s1"></u></i></div>
   <div class="stat"><span>Acceleration</span><i><u id="s2"></u></i></div>
   <div class="stat"><span>Handling</span><i><u id="s3"></u></i></div>
   <button class="btn buy" id="buy" hidden></button>
  </div>
  <h2>Settings</h2>
  <button class="tg" id="tgs"><span>Sound effects</span><em></em></button>
  <button class="tg" id="tgt"><span>Tilt steering (portrait)</span><em></em></button>
  <p style="color:var(--muted);font-size:13px;margin:12px 4px 0">Steer with the arrows, or arrow keys / A and D. Hold Nitro for a speed boost. Collect coins to unlock faster cars.</p>
 </div>
 <div class="foot"><button class="btn" id="go">Start race</button></div>
</div>

<!-- pause -->
<div class="ov" id="pause" hidden style="justify-content:center">
 <div class="card"><h1>Paused</h1>
  <div class="row" style="flex-direction:column">
   <button class="btn" id="resume">Resume</button>
   <button class="btn alt" id="restart">Restart race</button>
   <button class="btn alt" id="quit">Quit to garage</button>
  </div></div>
</div>

<!-- results -->
<div class="ov" id="res" hidden style="justify-content:center">
 <div class="card"><p id="rt">Race finished</p><div class="big" id="rp">1st</div><p id="rs"></p>
  <div style="margin-top:12px;text-align:left" id="rl"></div>
  <div class="row"><button class="btn alt" id="rm">Garage</button><button class="btn" id="ra">Race again</button></div>
 </div>
</div>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var EMB=window.parent!==window;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,p){return a+(b-a)*p}
function mod(a,n){return ((a%n)+n)%n}

/* ============ saved data ============ */
var KEY='playora-race-v1';
var SV={coins:0,own:['roadster'],car:'roadster',track:'city',best:{},sound:true,tilt:false,races:0,wins:0};
try{var _t=JSON.parse(localStorage.getItem(KEY)||'null');if(_t)for(var _k in _t)SV[_k]=_t[_k]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}}

var CARS=[
 {id:'roadster',name:'Roadster',color:'#ee3b34',price:0,top:.86,acc:1,hdl:1,wing:0},
 {id:'turbo',name:'Turbo GT',color:'#2f6bff',price:250,top:.91,acc:1.1,hdl:1.06,wing:1},
 {id:'king',name:'Street King',color:'#ffc21a',price:600,top:.95,acc:1.2,hdl:1.1,wing:1},
 {id:'phantom',name:'Phantom',color:'#7b3fe4',price:1100,top:.99,acc:1.3,hdl:1.14,wing:2},
 {id:'nova',name:'Nova',color:'#eef1f6',price:1800,top:1.03,acc:1.4,hdl:1.2,wing:2}
];
var RIVALS=['#2fb36d','#ff8a1f','#e8458b','#33c4d6','#9aa5b8','#b6e04a'];
function carById(id){for(var i=0;i<CARS.length;i++)if(CARS[i].id===id)return CARS[i];return CARS[0]}

/* ============ engine constants ============ */
var segL=200,rumbleLen=3,lanes=3,roadWidth=2000,camH=2200,fov=100;
var camDepth=1/Math.tan((fov/2)*Math.PI/180);
var drawDist=260,fogDensity=3,step=1/60;
var maxSpeed=segL/step,accel=maxSpeed/5,breaking=-maxSpeed,decel=-maxSpeed/5,offDecel=-maxSpeed/2,offLimit=maxSpeed/4,centrifugal=.3;
var playerZ=camH*camDepth;
var CAR_W=1000,CAR_OFF=CAR_W/roadWidth;
var LAPS=3;
var ROAD={LENGTH:{NONE:0,SHORT:25,MEDIUM:50,LONG:100},HILL:{NONE:0,LOW:20,MEDIUM:40,HIGH:60},CURVE:{NONE:0,EASY:2,MEDIUM:4,HARD:6}};

/* ============ canvas ============ */
var cv=$('c'),ctx=cv.getContext('2d');
var W=0,H=0,UX=0,UY=0,horizonY=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
 UX=W/2;UY=Math.min(H/2,UX*1.1);horizonY=clamp(H*.8-UY,H*.3,H*.55)}
window.addEventListener('resize',resize);resize();

/* ============ drawing helpers ============ */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function shade(hex,a){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
 if(a<0){r*=1+a;g*=1+a;b*=1+a}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a}return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}

/* a realistic-looking rear view of a car, drawn with code. x = centre, y = ground, w = width */
function drawCar(c,x,y,w,color,wing,brake,nitro,tilt){
 c.save();c.translate(x,y);if(tilt)c.rotate(tilt);c.scale(w,w);
 c.globalAlpha*=1;
 c.fillStyle='rgba(0,0,0,.38)';c.beginPath();c.ellipse(0,-.005,.53,.055,0,0,7);c.fill();
 c.fillStyle='#121216';rr(c,-.47,-.215,.17,.215,.045);c.fill();rr(c,.30,-.215,.17,.215,.045);c.fill();
 c.fillStyle='#2a2a33';rr(c,-.455,-.2,.05,.17,.02);c.fill();rr(c,.405,-.2,.05,.17,.02);c.fill();
 var g=c.createLinearGradient(0,-.40,0,-.10);g.addColorStop(0,shade(color,.3));g.addColorStop(.45,color);g.addColorStop(1,shade(color,-.38));
 c.fillStyle=g;rr(c,-.5,-.40,1,.29,.08);c.fill();
 c.fillStyle=shade(color,.22);rr(c,-.45,-.47,.9,.10,.045);c.fill();
 c.fillStyle=shade(color,-.12);c.beginPath();c.moveTo(-.37,-.44);c.lineTo(-.25,-.615);c.lineTo(.25,-.615);c.lineTo(.37,-.44);c.closePath();c.fill();
 var wg=c.createLinearGradient(0,-.57,0,-.45);wg.addColorStop(0,'#46688f');wg.addColorStop(1,'#16233a');
 c.fillStyle=wg;c.beginPath();c.moveTo(-.31,-.455);c.lineTo(-.22,-.575);c.lineTo(.22,-.575);c.lineTo(.31,-.455);c.closePath();c.fill();
 c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.moveTo(-.2,-.57);c.lineTo(-.12,-.57);c.lineTo(-.2,-.46);c.lineTo(-.27,-.46);c.closePath();c.fill();
 if(wing>0){var wy=wing===2?-.585:-.545,dk=shade(color,-.5);
  c.fillStyle=dk;c.fillRect(-.30,-.50,.035,.08);c.fillRect(.265,-.50,.035,.08);
  rr(c,-.46,wy,.92,.05,.016);c.fill();
  if(wing===2){c.fillRect(-.47,wy-.035,.03,.10);c.fillRect(.44,wy-.035,.03,.10)}
  c.fillStyle='rgba(255,255,255,.28)';c.fillRect(-.42,wy+.004,.84,.008)}
 c.fillStyle=brake?'#ff3030':'#b61f2c';rr(c,-.47,-.365,.25,.085,.035);c.fill();rr(c,.22,-.365,.25,.085,.035);c.fill();
 c.fillStyle=brake?'#ffd0c8':'#e0566a';rr(c,-.44,-.35,.19,.03,.015);c.fill();rr(c,.25,-.35,.19,.03,.015);c.fill();
 if(brake){c.globalCompositeOperation='lighter';var rg=c.createRadialGradient(-.345,-.32,0,-.345,-.32,.22);rg.addColorStop(0,'rgba(255,50,50,.55)');rg.addColorStop(1,'rgba(255,50,50,0)');c.fillStyle=rg;c.fillRect(-.57,-.54,.45,.45);
  rg=c.createRadialGradient(.345,-.32,0,.345,-.32,.22);rg.addColorStop(0,'rgba(255,50,50,.55)');rg.addColorStop(1,'rgba(255,50,50,0)');c.fillStyle=rg;c.fillRect(.12,-.54,.45,.45);c.globalCompositeOperation='source-over'}
 c.fillStyle=shade(color,-.55);rr(c,-.5,-.22,1,.115,.05);c.fill();
 c.fillStyle='#f1f1e8';rr(c,-.095,-.30,.19,.075,.012);c.fill();c.fillStyle='#8a8a80';c.fillRect(-.075,-.275,.15,.012);
 c.fillStyle='#24242c';c.beginPath();c.arc(-.28,-.11,.035,0,7);c.fill();c.beginPath();c.arc(.28,-.11,.035,0,7);c.fill();
 if(nitro){c.globalCompositeOperation='lighter';[-.28,.28].forEach(function(ex){var fl=c.createLinearGradient(0,-.1,0,.12);fl.addColorStop(0,'#fff');fl.addColorStop(.35,'#6fe0ff');fl.addColorStop(1,'rgba(40,120,255,0)');c.fillStyle=fl;c.beginPath();c.moveTo(ex-.032,-.1);c.lineTo(ex,.14+Math.random()*.05);c.lineTo(ex+.032,-.1);c.closePath();c.fill()});c.globalCompositeOperation='source-over'}
 c.restore()}

/* ============ roadside sprites (all drawn by code) ============ */
function drawSprite(c,sp,x,y,dw,dh,t){
 c.save();c.translate(x,y);c.scale(dw,dh);
 var k=sp.kind;
 if(k==='building'){
  c.fillStyle=sp.col;c.fillRect(-.5,-1,1,1);c.fillStyle=shade(sp.col,-.25);c.fillRect(.28,-1,.22,1);c.fillStyle=shade(sp.col,.18);c.fillRect(-.5,-1,1,.03);
  if(dw>16){var cols=4,rows=sp.rows;for(var r=0;r<rows;r++)for(var q=0;q<cols;q++){var on=((r*7+q*13+sp.seed)%5)>0;c.fillStyle=sp.lit?(on?'#ffd479':'#2b2a52'):(on?'#a9c7e6':'#6b8aa8');c.fillRect(-.42+q*.19,-.94+r*(.88/rows),.12,.5/rows)}}
 }else if(k==='palm'){
  c.fillStyle='#7a5a3a';c.beginPath();c.moveTo(-.05,0);c.lineTo(.05,0);c.lineTo(.03,-.66);c.lineTo(-.03,-.66);c.fill();
  c.fillStyle='#2f9e5b';for(var a=0;a<6;a++){c.save();c.translate(0,-.66);c.rotate(-2.6+a*.95);c.beginPath();c.ellipse(.22,0,.26,.055,0,0,7);c.fill();c.restore()}
 }else if(k==='pine'){
  c.fillStyle='#4a3424';c.fillRect(-.05,-.2,.1,.2);
  for(var i=0;i<3;i++){c.fillStyle=i%2?'#0f3d2d':'#14503a';c.beginPath();c.moveTo(0,-1+i*.2);c.lineTo(.42-i*.04,-.55+i*.2);c.lineTo(-.42+i*.04,-.55+i*.2);c.fill()}
 }else if(k==='cactus'){
  c.fillStyle='#3f9b53';rr(c,-.12,-1,.24,1,.12);c.fill();rr(c,-.45,-.66,.33,.1,.05);c.fill();rr(c,-.45,-.84,.11,.28,.055);c.fill();rr(c,.12,-.52,.3,.1,.05);c.fill();rr(c,.32,-.7,.1,.28,.05);c.fill();
  c.fillStyle='rgba(0,0,0,.18)';c.fillRect(.02,-.95,.08,.95);
 }else if(k==='rock'){
  c.fillStyle='#8c7b6a';c.beginPath();c.moveTo(-.5,0);c.lineTo(-.42,-.5);c.lineTo(-.1,-.95);c.lineTo(.25,-.8);c.lineTo(.5,-.3);c.lineTo(.46,0);c.fill();
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.moveTo(-.42,-.5);c.lineTo(-.1,-.95);c.lineTo(.02,-.6);c.fill();
 }else if(k==='mesa'){

 nitroOn=racing&&input.nit&&nitro>0&&speed>maxSpeed*.2;
 if(nitroOn){boost=true;mx*=1.3;nitro=Math.max(0,nitro-34*dt)}else nitro=Math.min(100,nitro+(racing?4:0)*dt);
 var dx=dt*2*sp*car.hdl;

 if(racing){playerX+=dx*steerInput();raceTime+=dt}
 playerX-=dx*sp*pSeg.curve*centrifugal;
 if(racing){if(input.brake)speed+=breaking*dt;else speed+=accel*car.acc*(boost?2.4:1)*dt}
 else if(fin)speed+=breaking*.5*dt;
 if((playerX<-1||playerX>1)){
  if(speed>offLimit)speed+=offDecel*dt;
  for(var n=0;n<pSeg.sprites.length;n++){var s=pSeg.sprites[n],sw=s.w/roadWidth;
   if(s.solid&&overlap(playerX,CAR_OFF,s.offset+sw/2*(s.offset>0?1:-1),sw,.8)){speed=maxSpeed/6;position=mod(pSeg.p1.world.z-playerZ,trackLength);crashFx();break}}}
 /* coins: check every segment passed this frame */
 var z0=oldZ,z1=position+playerZ,a=Math.floor(mod(z0,trackLength)/segL),b=Math.floor(mod(z1,trackLength)/segL),cnt=0;
 for(var si=a;cnt<4;cnt++){var sg=segments[si%segments.length];
  for(var q=0;q<sg.sprites.length;q++){var cs=sg.sprites[q];if(cs.coin&&!cs.got&&overlap(playerX,CAR_OFF,cs.offset,.35,1)){cs.got=true;coinsGot++;nitro=Math.min(100,nitro+4);sfxCoin()}}
  if(si%segments.length===b)break;si++}
 /* collisions with rivals */
 for(var m=0;m<pSeg.cars.length;m++){var oc=pSeg.cars[m];if(speed>oc.speed&&overlap(playerX,CAR_OFF,oc.offset,CAR_OFF,.8)){speed=oc.speed*(oc.speed/Math.max(1,speed));position=mod(oc.z-playerZ,trackLength);crashFx();break}}
 playerX=clamp(playerX,-2.2,2.2);speed=clamp(speed,0,mx);
 /* progress */
 var d=position-prevPos;if(d<-trackLength/2)lapIdx++;else if(d>trackLength/2)lapIdx--;prevPos=position;pDist=lapIdx*trackLength+position;

 if(fin){resTimer-=dt;if(resTimer<=0)showResults()}

var nitroWas=false;
function skyAdvance(dt,pos,spd,old){var dp=(old===undefined)?spd*dt:(pos-old);if(Math.abs(dp)>trackLength/2)dp=0;var sg=findSeg((old===undefined?pos:pos)+playerZ);

/* ============ rendering ============ */
function render(){
 var t=tNow,menu=state==='menu',pos=menu?demoPos:position,pX=menu?0:playerX;
 var baseSeg=findSeg(pos),basePct=(mod(pos,segL))/segL,pSeg=findSeg(pos+playerZ),pPct=(mod(pos+playerZ,segL))/segL;
 var playerY=lerp(pSeg.p1.world.y,pSeg.p2.world.y,pPct);
 var sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake*.6;cv.style.transform='translate('+sx+'px,'+sy+'px) scale(1.05)'}else if(cv.style.transform)cv.style.transform='';
 ctx.save();
 drawSky(t);
 var maxy=H,x=0,dxs=-(baseSeg.curve*basePct),n,seg;
 for(n=0;n<drawDist;n++){
  seg=segments[(baseSeg.index+n)%segments.length];
  seg.looped=seg.index<baseSeg.index;seg.fog=1/Math.pow(Math.E,(n/drawDist)*(n/drawDist)*fogDensity);seg.clip=maxy;
  project(seg.p1,(pX*roadWidth)-x,playerY+camH,pos-(seg.looped?trackLength:0));
  project(seg.p2,(pX*roadWidth)-x-dxs,playerY+camH,pos-(seg.looped?trackLength:0));
  x+=dxs;dxs+=seg.curve;
  if(seg.p1.camera.z<=camDepth||seg.p2.screen.y>=seg.p1.screen.y||seg.p2.screen.y>=maxy)continue;
  drawSegment(seg,seg.fog);maxy=seg.p1.screen.y}
 for(n=drawDist-1;n>0;n--){
  seg=segments[(baseSeg.index+n)%segments.length];
  var k,sp;
  for(k=0;k<seg.cars.length;k++){var c=seg.cars[k],sc=lerp(seg.p1.screen.scale,seg.p2.screen.scale,c.percent),cx=lerp(seg.p1.screen.x,seg.p2.screen.x,c.percent)+(sc*c.offset*roadWidth*UX),cy=lerp(seg.p1.screen.y,seg.p2.screen.y,c.percent);
   var cw=sc*UX*c.w;if(cw<2)continue;ctx.globalAlpha=Math.max(0,seg.fog*1.1>1?1:seg.fog*1.1);
   if(cy>seg.clip+cw*.62)continue;
   if(!menu&&n<8&&Math.abs(c.offset-pX)<.9)continue;
   drawCar(ctx,cx,cy,cw,c.color,c.wing,false,false,0);ctx.globalAlpha=1}
  for(k=0;k<seg.sprites.length;k++){sp=seg.sprites[k];if(sp.got)continue;
   var scl=seg.p1.screen.scale,spx=seg.p1.screen.x+(scl*sp.offset*roadWidth*UX),spy=seg.p1.screen.y,dw=scl*UX*sp.w,dh=scl*UX*sp.h;
   if(dw<1.5||spx+dw<-20||spx-dw>W+20)continue;
   var hid=spy-seg.clip,al=Math.max(0,Math.min(1,seg.fog*1.15));ctx.globalAlpha=al;
   if(hid>0&&hid<dh){ctx.save();ctx.beginPath();ctx.rect(-50,-50,W+100,seg.clip+50);ctx.clip();drawSprite(ctx,sp,spx,spy,dw,dh,t);ctx.restore()}
   else if(hid<=0)drawSprite(ctx,sp,spx,spy,dw,dh,t);
   ctx.globalAlpha=1}
  if(!menu&&seg===pSeg){
   var scp=camDepth/playerZ,pw=scp*UX*CAR_W,py=horizonY-scp*lerp(pSeg.p1.camera.y,pSeg.p2.camera.y,pPct)*UY;
   var bounce=(speed>offLimit&&Math.abs(playerX)>1?(Math.random()-.5)*5:(Math.random()-.5)*1.5*(speed/maxSpeed));
   drawCar(ctx,W/2,py+bounce,pw,car.color,car.wing,!!input.brake&&state==='race',nitroOn,steerInput()*.05*(speed/maxSpeed))}
 }
 if(nitroOn){ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;for(var i=0;i<16;i++){var a=i*.39+tNow*3,r1=Math.min(W,H)*.45,r2=Math.max(W,H)*.8;ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r1,H*.5+Math.sin(a)*r1);ctx.lineTo(W/2+Math.cos(a)*r2,H*.5+Math.sin(a)*r2);ctx.stroke()}}
 ctx.restore();
 $('flash').style.opacity=flash>0?String(Math.min(.55,flash)):'0'}

/* ============ HUD ============ */
var hudCache={};
function setT(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v}}
function fmt(t){var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function rank(){var r=1;cars.forEach(function(c){if(c.dist>pDist)r++});return r}
function updateHud(force){
 var lap=clamp(Math.floor(pDist/trackLength)+1,1,LAPS);
 if(state==='finish')lap=LAPS;
 setT('hp',String(state==='finish'?finishRank:rank()));setT('hpn','/'+(cars.length+1));setT('hl','Lap '+lap+'/'+LAPS);setT('ht',fmt(raceTime));
 setT('hs',String(Math.round(speed/maxSpeed*260)));setT('hc','🪙 '+coinsGot);
 $('hn').style.width=nitro+'%'}
var bigT=0;
function showBig(txt){var b=$('big');b.textContent=txt;b.hidden=false;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');clearTimeout(bigT);bigT=setTimeout(function(){b.hidden=true},900)}

/* ============ results / menus ============ */
function ord(n){return n+(n===1?'st':n===2?'nd':n===3?'rd':'th')}
function showResults(){
 if(state==='results')return;state='results';engineStop();
 $('hud').hidden=true;$('ctl').hidden=true;
 var reward=[150,100,60,40,25,15][finishRank-1]||15,tot=reward+coinsGot,key=SV.track,prev=SV.best[key],nb=!prev||raceTime<prev;
 SV.coins+=tot;SV.races++;if(finishRank===1)SV.wins++;if(nb)SV.best[key]=raceTime;save();
 $('rt').textContent=THEMES[key].name+' · 3 laps';$('rp').textContent=ord(finishRank)+(finishRank===1?' 🏆':'');
 $('rs').textContent='Time '+fmt(raceTime)+(nb?' · New best!':'');
 $('rl').innerHTML='<div class="rw"><span>Finish bonus</span><span>🪙 '+reward+'</span></div><div class="rw"><span>Coins collected</span><span>🪙 '+coinsGot+'</span></div><div class="rw"><b>Total</b><b>🪙 '+tot+'</b></div>';
 $('res').hidden=false;
 try{parent.postMessage({type:'playora:result',game:'Car Race',text:'Finished '+ord(finishRank)+' on '+THEMES[key].name+' in '+fmt(raceTime)},'*')}catch(e){}}
function toMenu(){state='menu';engineStop();$('hud').hidden=true;$('ctl').hidden=true;$('res').hidden=true;$('pause').hidden=true;$('menu').hidden=false;buildTrackIfNeeded();renderMenu()}
function doPause(){if(state!=='race'&&state!=='countdown')return;state='paused';pausedFrom=true;engineStop();$('pause').hidden=false}
var pausedFrom=false;
function doResume(){if(state!=='paused')return;$('pause').hidden=true;state=cd>0&&raceTime===0&&cdLast>0?'countdown':'race';if(SV.sound)engineStart()}
function quitRace(){if(coinsGot){SV.coins+=coinsGot;save()}toMenu()}

/* menu rendering */
function renderMenu(){
 $('mc').textContent='🪙 '+SV.coins;
 var tr=$('tracks');tr.innerHTML='';
 TKEYS.forEach(function(k){var T=THEMES[k],b=document.createElement('button');b.className='trk'+(SV.track===k?' sel':'');b.style.background=T.card;
  var best=SV.best[k];b.innerHTML='<b>'+T.name+'</b><span>'+T.tag+'</span><span>'+(best?'Best '+fmt(best):'No time yet')+'</span>';
  b.onclick=function(){SV.track=k;save();buildTrackIfNeeded();demoPos=0;renderMenu()};tr.appendChild(b)});
 var ci=CARS.indexOf(carBrowse||carById(SV.car));carBrowse=CARS[ci];
 var c=carBrowse,owned=SV.own.indexOf(c.id)>=0;
 $('gn').textContent=c.name;
 $('s1').style.width=((c.top-.7)/.4*100)+'%';$('s2').style.width=((c.acc-.7)/.8*100)+'%';$('s3').style.width=((c.hdl-.7)/.6*100)+'%';
 var buy=$('buy');
 if(owned){buy.hidden=SV.car===c.id;buy.textContent='Use this car';buy.disabled=false;buy.dataset.m='use'}
 else{buy.hidden=false;buy.textContent='Unlock for 🪙 '+c.price;buy.disabled=SV.coins<c.price;buy.dataset.m='buy'}
 drawPreview(c);
 setTog('tgs',SV.sound);setTog('tgt',SV.tilt)}
var carBrowse=null;
function setTog(id,on){var b=$(id);b.classList.toggle('on',!!on);b.querySelector('em').textContent=on?'On':'Off';b.setAttribute('aria-pressed',on?'true':'false')}
function drawPreview(c){var cc=$('cv'),x=cc.getContext('2d');x.clearRect(0,0,cc.width,cc.height);
 var g=x.createRadialGradient(250,250,10,250,250,150);g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(100,100,300,220);
 drawCar(x,250,270,400,c.color,c.wing,false,false,0)}

/* ============ sound (all made in code, no files) ============ */
var AC=null,master=null,noiseBuf=null,eng=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  var l=AC.sampleRate*1.2;noiseBuf=AC.createBuffer(1,l,AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<l;i++)d[i]=Math.random()*2-1}
 if(AC.state==='suspended')AC.resume();return AC}
function beep(f,dur,type,v,delay){if(!SV.sound||!ac())return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function noise(dur,fq,type,v,sweepTo){if(!SV.sound||!ac())return;var t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.setValueAtTime(fq,t);if(sweepTo)f.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05)}
function sfxCoin(){beep(988,.09,'square',.1);beep(1319,.14,'square',.1,.07)}
function sfxCrash(){noise(.45,900,'lowpass',.7,120);beep(70,.3,'sine',.5)}
function sfxNitro(){noise(.7,500,'bandpass',.35,3500)}
function sfxFinish(r){var n=r===1?[523,659,784,1047]:[392,494,587];n.forEach(function(f,i){beep(f,.28,'triangle',.18,i*.13)})}
function engineStart(){if(!SV.sound||!ac()||eng)return;
 var o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o1.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=600;g.gain.value=.0001;
 o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();
 var n=AC.createBufferSource(),bp=AC.createBiquadFilter(),ng=AC.createGain();n.buffer=noiseBuf;n.loop=true;bp.type='bandpass';bp.frequency.value=800;ng.gain.value=0;n.connect(bp);bp.connect(ng);ng.connect(master);n.start();
 eng={o1:o1,o2:o2,g:g,f:f,n:n,ng:ng}}
function engineSet(sp,nit,off){if(!eng||!AC)return;var t=AC.currentTime,fr=42+sp*150+(nit?26:0);
 eng.o1.frequency.setTargetAtTime(fr,t,.06);eng.o2.frequency.setTargetAtTime(fr*.5,t,.06);eng.f.frequency.setTargetAtTime(380+sp*1500,t,.08);eng.g.gain.setTargetAtTime(.045+sp*.075,t,.06);eng.ng.gain.setTargetAtTime(off?.1:0,t,.1)}
function engineStop(){if(!eng)return;try{eng.o1.stop();eng.o2.stop();eng.n.stop()}catch(e){}eng=null}

/* ============ input ============ */
function hold(id,key,val){var b=$(id);function on(e){e.preventDefault();input[key]=val;b.classList.add('on')}function off(e){input[key]=0;b.classList.remove('on')}
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);b.addEventListener('contextmenu',function(e){e.preventDefault()})}
hold('bl','l',1);hold('br','r',1);hold('bb','brake',1);hold('bn','nit',1);
var KM={ArrowLeft:['l'],KeyA:['l'],ArrowRight:['r'],KeyD:['r'],ArrowDown:['brake'],KeyS:['brake'],Space:['nit'],ShiftLeft:['nit'],ShiftRight:['nit']};
window.addEventListener('keydown',function(e){if(KM[e.code]){input[KM[e.code][0]]=1;e.preventDefault()}
 if(e.code==='KeyP'||e.code==='Escape'){state==='paused'?doResume():doPause()}if(e.code==='Enter'&&state==='menu')$('go').click()});
window.addEventListener('keyup',function(e){if(KM[e.code])input[KM[e.code][0]]=0});
function onTilt(e){var ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;if(ang===90||ang===270||ang===-90){tiltVal=0;return}
 var v=(e.gamma||0)*(ang===180?-1:1);tiltVal=Math.abs(v)<3?0:clamp(v/24,-1,1)}
var tiltOn=false;
function enableTilt(){if(tiltOn)return;
 if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted'){window.addEventListener('deviceorientation',onTilt);tiltOn=true}else{SV.tilt=false;save();renderMenu()}}).catch(function(){})}
 else{window.addEventListener('deviceorientation',onTilt);tiltOn=true}}
if(SV.tilt)enableTilt();

$('go').onclick=function(){ac();resetRace()};
$('buy').onclick=function(){var c=carBrowse;if($('buy').dataset.m==='buy'){if(SV.coins>=c.price){SV.coins-=c.price;SV.own.push(c.id);SV.car=c.id;save();sfxCoin()}}else{SV.car=c.id;save()}renderMenu()};
$('gp').onclick=function(){carBrowse=CARS[mod(CARS.indexOf(carBrowse)-1,CARS.length)];renderMenu()};
$('gnx').onclick=function(){carBrowse=CARS[mod(CARS.indexOf(carBrowse)+1,CARS.length)];renderMenu()};
$('tgs').onclick=function(){SV.sound=!SV.sound;save();renderMenu();if(SV.sound){ac();sfxCoin()}};
$('tgt').onclick=function(){SV.tilt=!SV.tilt;save();if(SV.tilt)enableTilt();renderMenu()};
$('pz').onclick=doPause;$('resume').onclick=doResume;$('restart').onclick=function(){if(coinsGot){SV.coins+=coinsGot;save()}resetRace()};$('quit').onclick=quitRace;
$('ra').onclick=function(){resetRace()};$('rm').onclick=toMenu;
$('back').onclick=function(){if(EMB)parent.postMessage({type:'playora:exit'},'*');else location.href='../index.html'};
document.addEventListener('visibilitychange',function(){if(document.hidden)doPause()});

/* ============ main loop ============ */
var last=0,acc=0;
function frame(ts){requestAnimationFrame(frame);if(!last)last=ts;var d=Math.min(.25,(ts-last)/1000);last=ts;acc+=d;
 while(acc>=step){update(step);acc-=step}
 render()}
buildTrackIfNeeded();carBrowse=carById(SV.car);toMenu();
requestAnimationFrame(frame);

/* handy for testing */
window.__race={get state(){return state},get speed(){return speed},get dist(){return pDist},get segs(){return segments.length},start:resetRace,input:input,setTrack:function(k){SV.track=k;buildTrackIfNeeded()},get rank(){return rank()},get coins(){return coinsGot},warp:function(p){position=p;prevPos=p}};
})();
