<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d31">
<title>Whot - Play the Nigerian card game</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--cream:#fff8e7;--ink:#2a1d12;--gold:#f2b134;--red:#d7263d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#0a3b2f;color:var(--cream);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);--bk:repeating-linear-gradient(45deg,#a31d2e 0 6px,#8b1626 6px 12px)}
body[data-back="1"]{--bk:repeating-linear-gradient(135deg,#1e4fb0 0 6px,#173d8a 6px 12px)}
body[data-back="2"]{--bk:repeating-conic-gradient(#0e7a58 0 25%,#0b5f45 0 50%) 0 0/14px 14px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:8px 10px;text-shadow:0 1px 3px #0008}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:28px;letter-spacing:2px;color:var(--gold);font-style:italic}
#score{font-size:13px;background:#0005;border-radius:20px;padding:4px 12px}
button{font:inherit;cursor:pointer}
.ib{background:#0006;color:var(--cream);border:1px solid #fff4;border-radius:12px;padding:8px 14px;font-weight:700}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lab{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin:2px auto;background:#0006;border-radius:20px;padding:3px 12px;width:max-content;transition:box-shadow .3s}
.lab.on{box-shadow:0 0 0 2px var(--gold),0 0 14px var(--gold)}
.dots i{display:inline-block;width:5px;height:5px;margin-left:3px;border-radius:50%;background:var(--gold);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
#cpu{display:flex;justify-content:center;align-items:flex-end;height:82px;margin-top:4px}
#cpu .back{--w:46px;margin-left:-26px;transform:rotate(var(--r,0deg));transform-origin:50% 120%}
#cpu .back:first-child{margin-left:0}
#mid{flex:1;display:flex;align-items:center;justify-content:center;gap:26px;min-height:150px}
.pile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px}
.card,.back{--w:66px;width:var(--w);height:calc(var(--w)*1.5);border-radius:calc(var(--w)*.14);flex:0 0 auto;position:relative}
.card.big,.back.big{--w:92px}
.card{background:linear-gradient(145deg,#fffefa,#f2e8cc);color:var(--ink);box-shadow:0 1px 0 #fff inset,0 4px 10px #0008,0 0 0 1px #0004;border:0;padding:0;font-family:inherit;font-size:calc(var(--w)*.27);font-weight:800;overflow:hidden}
.card::before{content:"";position:absolute;inset:calc(var(--w)*.045);border:1px solid color-mix(in srgb,var(--c,#999) 45%,transparent);border-radius:calc(var(--w)*.1);pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#fff9 50%,transparent 60%);opacity:.35;pointer-events:none}
.cn{position:absolute;left:calc(var(--w)*.1);top:calc(var(--w)*.08);display:flex;flex-direction:column;align-items:center;line-height:1;color:var(--c);gap:2px}
.cn.r{left:auto;top:auto;right:calc(var(--w)*.1);bottom:calc(var(--w)*.08);transform:rotate(180deg)}
.cn svg{width:calc(var(--w)*.2);height:calc(var(--w)*.2)}
.mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 2px #0004)}
.mid svg{width:56%;height:56%}
.card.whot{background:linear-gradient(150deg,#c8102e,#7a0a1c);color:#ffd36b;--c:#ffd36b}
.card.whot::before{border-color:#ffd36b99}
.card.whot .wt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:calc(var(--w)*.2);letter-spacing:1px;text-shadow:0 2px 3px #0008}
.card.whot .wt b{font-size:calc(var(--w)*.36);line-height:1}
.card.whot .sm{display:flex;gap:1px}.card.whot .sm svg{width:calc(var(--w)*.1);height:calc(var(--w)*.1)}
.back{background:var(--bk);border:3px solid var(--cream);box-shadow:0 4px 10px #0008;display:flex;align-items:center;justify-content:center}
.back::after{content:"W";width:46%;aspect-ratio:1;border-radius:50%;background:var(--gold);color:#5a1111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--w)*.26);font-style:italic}
.back.big{cursor:pointer}
.back.live{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}
.hint{animation:pulse .6s 3}
@keyframes pulse{50%{transform:translateY(-22px) scale(1.08)}}
#chip{display:flex;align-items:center;gap:6px;background:#0007;border-radius:20px;padding:3px 10px 3px 6px}
.land{animation:land .3s}
@keyframes land{from{transform:scale(1.18) rotate(-4deg)}to{transform:none}}
#info{min-height:42px;text-align:center;font-size:15px;padding:2px 6px}
#info b{color:var(--gold)}
#act{display:flex;justify-content:center;gap:8px;min-height:36px}
#act button{padding:6px 14px;font-size:14px}
#me{display:flex;overflow-x:auto;padding:22px 8px 12px;min-height:150px}
#me>:first-child{margin-left:auto}#me>:last-child{margin-right:auto}
#me .card{cursor:pointer;transition:transform .15s,box-shadow .15s}
#me .card.ok{z-index:2;transform:translateY(-14px);box-shadow:0 0 0 3px var(--gold),0 6px 12px #000a}
#me .card.no{filter:brightness(.7);cursor:default}
.deal{animation:deal .45s backwards}
@keyframes deal{from{transform:translateY(120px) scale(.6);opacity:0}}
.fly{position:fixed!important;left:0;top:0;margin:0!important;z-index:20;pointer-events:none;transform-origin:0 0}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:800;padding:10px 20px;border-radius:30px;z-index:30;display:none;text-shadow:none;box-shadow:0 6px 20px #0008}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:25}
.modal.on{display:flex}
.sheet{background:#fff8e7;color:var(--ink);border-radius:18px;padding:16px;width:100%;max-width:440px;max-height:90%;overflow:auto;text-shadow:none}
.sheet h2{margin:0 0 6px;font-size:20px}.sheet h3{margin:14px 0 4px;font-size:14px}
.sheet p,.sheet li{font-size:14px;line-height:1.45}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.btn{background:var(--ink);color:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:8px 13px;font-weight:700;font-size:14px}
.btn.alt{background:transparent;color:var(--ink)}
.btn.sel{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{aspect-ratio:3/4;border-radius:10px;border:3px solid transparent;cursor:pointer;padding:0;overflow:hidden;position:relative;color:#fff;font-size:10px;text-shadow:0 1px 2px #000}
.th span{position:absolute;bottom:2px;left:0;right:0;text-align:center}
.th.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--ink)}
.bk{display:flex;gap:10px}.bk .back{--w:44px;cursor:pointer;border-width:2px}.bk .sel{box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--ink)}
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.shapes button{background:#fff;border:2px solid #d9cfb4;border-radius:10px;padding:10px 0;display:flex;justify-content:center}
input{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--ink);width:100%}
details{margin-top:12px}
@media (max-height:660px){#cpu{height:62px}#cpu .back{--w:38px}.card,.back{--w:58px}#me{min-height:120px}}
</style></head>
<body data-back="0">
<div id="app">
<header><h1>Whot</h1><span id="score"></span><button class="ib" id="mb">Settings</button></header>
<div class="lab" id="cl"></div>
<section id="cpu" aria-label="Computer's cards"></section>
<section id="mid"><div class="pile"><div class="back big" id="mkt" role="button" tabindex="0" aria-label="Draw from market"></div><span id="mn"></span></div><div class="pile"><div id="top"></div><div id="chip"></div></div></section>
<div id="info" aria-live="polite"></div>
<div id="act"><button class="ib" id="hb">Hint</button></div>
<div class="lab" id="pl"></div>
<section id="me" aria-label="Your cards"></section>
</div>
<div id="toast"></div>
<div class="modal" id="pick"><div class="sheet"><h2>Choose a shape</h2><div class="shapes" id="shapes"></div></div></div>
<div class="modal" id="end"><div class="sheet"><h2 id="et"></h2><p id="eb"></p><div class="row"><button class="btn" id="again">Play again</button></div></div></div>
<div class="modal" id="menu"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
"use strict";
var SH={circle:'<circle cx="12" cy="12" r="9"/>',triangle:'<path d="M12 3 22 21H2z"/>',cross:'<path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/>',square:'<rect x="3" y="3" width="18" height="18" rx="2"/>',star:'<path d="m12 2 3 7 7.5.6-5.7 5 1.8 7.4L12 18l-6.6 4 1.8-7.4-5.7-5L9 9z"/>'};
var COL={circle:'#c8102e',triangle:'#1456b8',cross:'#5b2a86',square:'#d97706',star:'#0b8a5f'};
var NUMS={circle:[1,2,3,4,5,7,8,10,11,12,13,14],triangle:[1,2,3,4,5,7,8,10,11,12,13,14],cross:[1,2,3,5,7,10,11,13,14],square:[1,2,3,5,7,10,11,13,14],star:[1,2,3,4,5,7,8]};
var NAMES=['Tunde','Amaka','Chidi','Zainab','Emeka','Ngozi','Bayo','Fatima'];
var $=function(i){return document.getElementById(i)};
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var S={lv:'medium',def:true,mus:true,sfx:true,vib:true,vol:.5,bg:0,back:0,spd:1,start:6,name:'You',w:0,l:0};
try{var sv=JSON.parse(localStorage.getItem('whot-s2')||'null');if(sv)for(var k in sv)S[k]=sv[k]}catch(e){}
function save(){try{localStorage.setItem('whot-s2',JSON.stringify(S))}catch(e){}}

/* ---------- backgrounds (drawn in code, no image files) ---------- */
function u(s){return 'url("data:image/svg+xml,'+encodeURIComponent(s)+'")'}
var X='xmlns="http://www.w3.org/2000/svg"';
var BGS=[
{n:'Classic felt',c:'radial-gradient(circle at 50% 40%,#17745a,#0a3b2f 75%)'},
{n:'Lagos night',c:u('<svg '+X+' viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080b2a"/><stop offset=".62" stop-color="#2b2f78"/><stop offset="1" stop-color="#f08a4b"/></linearGradient></defs><rect width="400" height="800" fill="url(#g)"/><circle cx="310" cy="140" r="32" fill="#fff4cc"/><g fill="#fff" opacity=".8"><circle cx="40" cy="60" r="1.5"/><circle cx="120" cy="110" r="1.2"/><circle cx="200" cy="50" r="1.6"/><circle cx="250" cy="170" r="1.2"/><circle cx="60" cy="210" r="1.3"/><circle cx="350" cy="260" r="1.4"/></g><g fill="#090c22"><rect x="0" y="660" width="46" height="140"/><rect x="46" y="610" width="40" height="190"/><rect x="86" y="680" width="50" height="120"/><rect x="136" y="580" width="34" height="220"/><rect x="170" y="650" width="60" height="150"/><rect x="230" y="600" width="38" height="200"/><rect x="268" y="670" width="52" height="130"/><rect x="320" y="620" width="44" height="180"/><rect x="364" y="680" width="40" height="120"/></g><g fill="#ffd27a" opacity=".85"><rect x="52" y="630" width="5" height="6"/><rect x="66" y="650" width="5" height="6"/><rect x="143" y="600" width="5" height="6"/><rect x="153" y="630" width="5" height="6"/><rect x="238" y="620" width="5" height="6"/><rect x="250" y="650" width="5" height="6"/><rect x="330" y="640" width="5" height="6"/><rect x="345" y="670" width="5" height="6"/></g></svg>')+' center/cover no-repeat #0a0d24'},
{n:'Savannah sunset',c:u('<svg '+X+' viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b1f5e"/><stop offset=".5" stop-color="#ff5e62"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs><rect width="400" height="800" fill="url(#g)"/><circle cx="200" cy="560" r="70" fill="#ffe08a"/><path d="M0 680Q100 650 200 680T400 670V800H0z" fill="#2a1233"/><g fill="#1c0b24"><path d="M300 700h8v-60h-8z"/><ellipse cx="304" cy="632" rx="52" ry="14"/><path d="M80 710h6v-40h-6z"/><ellipse cx="83" cy="664" rx="34" ry="10"/></g></svg>')+' center/cover no-repeat #3b1f5e'},
{n:'Ocean deep',c:u('<svg '+X+' viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17c3d2"/><stop offset="1" stop-color="#052a52"/></linearGradient></defs><rect width="400" height="800" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="3"><path d="M0 120q50-30 100 0t100 0 100 0 100 0"/><path d="M0 260q50-30 100 0t100 0 100 0 100 0"/><path d="M0 420q50-30 100 0t100 0 100 0 100 0"/><path d="M0 600q50-30 100 0t100 0 100 0 100 0"/></g><g fill="#fff" opacity=".18"><circle cx="70" cy="300" r="6"/><circle cx="330" cy="500" r="9"/><circle cx="210" cy="680" r="5"/></g></svg>')+' center/cover no-repeat #052a52'},
{n:'Royal purple',c:u('<svg '+X+' width="40" height="40"><path d="M20 4l12 16-12 16L8 20z" fill="none" stroke="#f2b134" stroke-opacity=".22"/></svg>')+',radial-gradient(circle at 50% 35%,#6a2fa0,#1c0b36 78%)'},
{n:'Ankara print',c:u('<svg '+X+' width="80" height="80"><rect width="80" height="80" fill="#0d2a6b"/><circle cx="40" cy="40" r="30" fill="#f2711c"/><circle cx="40" cy="40" r="21" fill="#0d2a6b"/><circle cx="40" cy="40" r="13" fill="#ffd23f"/><circle cx="40" cy="40" r="5" fill="#c8102e"/><circle cx="0" cy="0" r="12" fill="#ffd23f"/><circle cx="80" cy="0" r="12" fill="#ffd23f"/><circle cx="0" cy="80" r="12" fill="#ffd23f"/><circle cx="80" cy="80" r="12" fill="#ffd23f"/></svg>')+' 0 0/80px 80px'},
{n:'Wooden table',c:'linear-gradient(#0002,#0006),repeating-linear-gradient(90deg,#7a4e2a 0 46px,#6a4222 46px 50px,#8a5a30 50px 96px,#5f3b1d 96px 100px)'},
{n:'Golden night',c:'repeating-linear-gradient(45deg,#ffffff08 0 2px,transparent 2px 14px),radial-gradient(circle at 50% 35%,#6b5114,#161004 72%)'}
];
function applyBg(){document.body.style.background=BGS[S.bg].c;document.body.setAttribute('data-back',S.back);var m=document.querySelector('meta[name=theme-color]');}

/* ---------- audio: music + effects made in code ---------- */
var AC,MG,NB,mt=null,st=0,nt=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination);var b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=b}if(AC.state==='suspended')AC.resume();MG.gain.value=S.vol*.7;return AC}
function tone(f,t,d,type,v,dest){var a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||a.destination);o.start(t);o.stop(t+d+.05);return o}
function nz(t,d,v,hp,dest){var a=ac(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest||a.destination);s.start(t);s.stop(t+d+.02)}
function sfx(n){if(!S.sfx)return;try{var t=ac().currentTime;
 if(n==='play'){nz(t,.09,.22,1800);tone(420,t,.08,'triangle',.12)}
 else if(n==='draw'){nz(t,.06,.15,3000);tone(300,t,.05,'sine',.08)}
 else if(n==='special'){tone(660,t,.15,'sine',.14);tone(990,t+.09,.2,'sine',.14)}
 else if(n==='last'){[880,660,880,660].forEach(function(f,i){tone(f,t+i*.11,.1,'square',.07)})}
 else if(n==='win'){[523,659,784,1047,1319].forEach(function(f,i){tone(f,t+i*.12,.3,'triangle',.16)})}
 else if(n==='lose'){[392,330,262,196].forEach(function(f,i){tone(f,t+i*.2,.35,'sawtooth',.07)})}
 else if(n==='tap'){tone(700,t,.04,'sine',.08)}
}catch(e){}}
var BASS=[110,87.31,130.81,98],PEN=[440,523.25,587.33,659.25,783.99,880],SP=60/104/4;
function sched(){var a=ac();while(nt<a.currentTime+.3){var s=st%16,bar=(st>>4)%4,t=nt;
 if(s===0||s===6||s===10){var o=tone(150,t,.18,'sine',.5,MG);o.frequency.exponentialRampToValueAtTime(45,t+.12)}
 if(s%2===0)nz(t,.04,s%4===2?.07:.035,6000,MG);
 if(s===4||s===12)nz(t,.1,.12,1500,MG);
 if(s===0||s===3||s===6||s===10||s===12)tone(BASS[bar],t,.24,'triangle',.3,MG);
 if(s%4===2&&Math.random()<.65)tone(PEN[Math.floor(Math.random()*PEN.length)],t,.32,'sine',.13,MG);
 if(s===0){tone(BASS[bar]*2,t,1.6,'sine',.07,MG);tone(BASS[bar]*3,t,1.6,'sine',.04,MG)}
 nt+=SP;st++}}
function musicOn(){if(mt||!S.mus)return;try{ac();nt=AC.currentTime+.1;mt=setInterval(sched,100)}catch(e){}}
function musicOff(){clearInterval(mt);mt=null}
document.addEventListener('pointerdown',function(){if(S.mus)musicOn()});
document.addEventListener('visibilitychange',function(){if(document.hidden)musicOff();else if(S.mus&&AC)musicOn()});
function vib(){if(S.vib&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}}

/* ---------- cards ---------- */
function svg(s,fill){return '<svg viewBox="0 0 24 24" fill="'+(fill||COL[s])+'" stroke="#0003" stroke-width=".6" aria-hidden="true">'+SH[s]+'</svg>'}
function cardEl(c,cls,tag){var d=document.createElement(tag||'div');d.className='card '+(cls||'')+(c.n===20?' whot':'');d.setAttribute('aria-label',c.n===20?'Whot card':c.s+' '+c.n);
 if(c.n===20){d.innerHTML='<div class="cn"><b>20</b></div><div class="wt"><b>20</b>WHOT<div class="sm">'+Object.keys(SH).map(function(s){return svg(s,'#ffd36b')}).join('')+'</div></div><div class="cn r"><b>20</b></div>'}
 else{d.style.setProperty('--c',COL[c.s]);d.innerHTML='<div class="cn"><b>'+c.n+'</b>'+svg(c.s)+'</div><div class="mid">'+svg(c.s)+'</div><div class="cn r"><b>'+c.n+'</b>'+svg(c.s)+'</div>'}
 return d}
function backEl(w){var d=document.createElement('div');d.className='back';if(w)d.style.setProperty('--w',w+'px');return d}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- animation: a card flies from where it is to where it goes ---------- */
function fly(card,from,to,dur,cb,flip){
 var e=card?cardEl(card,'fly'):backEl(from.width);e.classList.add('fly');
 if(card)e.style.setProperty('--w',from.width+'px');
 e.style.left=from.left+'px';e.style.top=from.top+'px';document.body.appendChild(e);
 var dx=to.left-from.left,dy=to.top-from.top,sc=to.width/from.width,d=RM?0:dur*S.spd;
 var fin=false;function done(){if(fin)return;fin=true;e.remove();cb&&cb()}
 try{var a=e.animate([{transform:'translate(0,0) scale(1) '+(flip?'rotateY(90deg)':'')},{transform:'translate('+dx+'px,'+dy+'px) scale('+sc+')'}],{duration:d,easing:'cubic-bezier(.2,.8,.25,1)',fill:'forwards'});a.onfinish=done}catch(x){}
 setTimeout(done,d+120)}
function rc(el){return el.getBoundingClientRect()}
function topRect(){var t=$('top').firstChild;return rc(t||$('top'))}
function confetti(){if(RM)return;for(var i=0;i<46;i++){var d=document.createElement('div');d.style.cssText='position:fixed;z-index:40;pointer-events:none;width:8px;height:12px;top:-20px;left:'+Math.random()*100+'vw;background:'+['#f2b134','#d7263d','#2a6fdb','#0e9f6e','#fff'][i%5];document.body.appendChild(d);(function(d){var a=d.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY(105vh) rotate('+(Math.random()*720)+'deg)'}],{duration:1800+Math.random()*1500,easing:'ease-in',delay:Math.random()*400});a.onfinish=function(){d.remove()}})(d)}}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(function(){t.style.display='none'},1500)}

/* ---------- game ---------- */
var G,lastTop='';
function newGame(){
 var d=[];for(var s in NUMS)NUMS[s].forEach(function(n){d.push({s:s,n:n})});for(var i=0;i<5;i++)d.push({s:'whot',n:20});shuffle(d);
 G={mkt:d,disc:[],h:[[],[]],turn:0,pend:0,pn:0,shape:'',over:false,choosing:false,busy:false,deal:true,cn:NAMES[Math.floor(Math.random()*NAMES.length)],msg:'Your turn. Match the shape or number, or tap the Market to draw.'};
 for(var p=0;p<2;p++)for(i=0;i<S.start;i++)G.h[p].push(G.mkt.pop());
 var k=G.mkt.findIndex(function(c){return [1,2,5,8,14,20].indexOf(c.n)<0});var f=G.mkt.splice(k,1)[0];G.disc.push(f);G.shape=f.s;
 hide('end');hide('menu');lastTop='';render();G.deal=false;
}
function refill(){if(G.mkt.length)return;var t=G.disc.pop();G.mkt=shuffle(G.disc);G.disc=[t]}
function draw(p,n){for(var i=0;i<n;i++){refill();if(!G.mkt.length)break;G.h[p].push(G.mkt.pop())}}
function topc(){return G.disc[G.disc.length-1]}
function ok(c){if(G.pend)return S.def&&c.n===G.pn;return c.n===20||c.s===G.shape||c.n===topc().n}
function who(p,a,b){return (p?G.cn:'You')+' '+(p?b:a)}
function live(){return G.turn===0&&!G.over&&!G.choosing&&!G.busy}

function humanPlay(i,el){if(!live())return;var c=G.h[0][i];if(!ok(c))return;G.busy=true;el.style.visibility='hidden';vib();sfx('play');
 fly(c,rc(el),topRect(),300,function(){G.busy=false;play(0,i)})}
function play(p,i){
 var c=G.h[p].splice(i,1)[0];G.disc.push(c);G.shape=c.s;
 if(!G.h[p].length){return finish(p)}
 if(c.n===20){
  if(p===0){G.choosing=true;render();show('pick');return}
  G.shape=cpuShape()}
 after(p,c)}
function after(p,c){
 var o=1-p,nx=o,m='';
 if(G.h[p].length===1){toast(p?G.cn+': Last card!':'Last card!');sfx('last')}
 if(c.n===1||c.n===8){nx=p;m=who(p,'play','plays')+' again ('+(c.n===1?'Hold on':'Suspension')+').';sfx('special')}
 else if(c.n===2||c.n===5){G.pend+=c.n===2?2:3;G.pn=c.n;m=(p?G.cn:'You')+' played '+c.n+'. '+(o?G.cn+' must':'You must')+' pick <b>'+G.pend+'</b>'+(S.def?' or defend with a '+c.n:'')+'.';sfx('special')}
 else if(c.n===14){draw(o,1);nx=p;m='General market! '+(o?G.cn+' draws':'You draw')+' 1. '+who(p,'play','plays')+' again.';sfx('special')}
 else if(c.n===20){m=who(p,'choose','chooses')+' <b>'+G.shape+'</b>.';sfx('special')}
 else if(p)m=G.cn+' played '+c.s+' '+c.n+'.';
 if(nx===0&&p===1)m+=' Your turn.';
 G.turn=nx;G.msg=m;render();if(nx===1)soon()}
function drawTurn(p){
 var n=G.pend||1,was=G.pend;G.busy=true;var from=rc($('mkt')),tg=rc(p?$('cpu'):$('me')),cnt=Math.min(n,5),dn=0;
 var to={left:tg.left+tg.width/2-from.width*.35,top:tg.top+tg.height/2-from.height*.35,width:from.width*.7,height:from.height*.7};
 if(p===0)to.top=tg.top+30;
 for(var i=0;i<cnt;i++)(function(i){setTimeout(function(){sfx('draw');fly(null,from,to,300,function(){if(++dn===cnt)fin()})},i*150*S.spd)})(i);
 function fin(){draw(p,n);G.pend=0;G.pn=0;G.busy=false;G.turn=1-p;
  G.msg=(p?G.cn+' draws ':'You draw ')+n+(was?' cards.':' card.')+(p?' Your turn.':'');render();if(G.turn===1)soon()}}
function finish(p){G.over=true;if(p===0)S.w++;else S.l++;save();render();sfx(p?'lose':'win');if(!p)confetti();
 $('et').textContent=p?G.cn+' wins':'You win!';$('eb').textContent=p?'Better luck next time. Try again.':'You finished all your cards.';setTimeout(function(){show('end')},900)}

function cpuShape(){var ct={};G.h[1].forEach(function(c){if(c.s!=='whot')ct[c.s]=(ct[c.s]||0)+1});var b=null,m=0;for(var s in ct)if(ct[s]>m){m=ct[s];b=s}return b||Object.keys(NUMS)[Math.floor(Math.random()*5)]}
function soon(){G.think=true;render();setTimeout(cpu,(S.lv==='easy'?1400:1100)*S.spd)}
function score(h,c){var sc=Math.random(),same=h.filter(function(x){return x.s===c.s}).length;sc+=same*.5;
 if(S.lv==='hard'){if(c.n===2||c.n===5||c.n===14)sc+=3;if(c.n===1||c.n===8)sc+=2;if(c.n===20&&h.length>2)sc-=6}else if(c.n===20)sc-=3;return sc}
function cpu(){
 G.think=false;if(G.over||G.turn!==1||G.choosing||G.busy)return;
 var h=G.h[1],pl=[];h.forEach(function(c,i){if(ok(c))pl.push(i)});
 if(!pl.length){G.msg=G.cn+' has no card to play.';render();return drawTurn(1)}
 var pick;
 if(S.lv==='easy')pick=pl[Math.floor(Math.random()*pl.length)];
 else{var best=-99;pl.forEach(function(i){var s=score(h,h[i]);if(s>best){best=s;pick=i}})}
 var bs=$('cpu').querySelectorAll('.back'),src=bs[Math.floor(Math.random()*bs.length)],c=h[pick];
 G.busy=true;src.style.visibility='hidden';sfx('play');
 fly(c,rc(src),topRect(),380,function(){G.busy=false;play(1,pick)},true)}

function hint(){if(!live()){return}sfx('tap');var best=-1,bi=-1;G.h[0].forEach(function(c,i){if(ok(c)){var s=(c.n===20?-5:0)+G.h[0].filter(function(x){return x.s===c.s}).length;if(s>best){best=s;bi=i}}});
 var el=bi<0?$('mkt'):$('me').children[bi];if(el){el.classList.add('hint');setTimeout(function(){el.classList.remove('hint')},2000)}
 G.msg=bi<0?'No card fits. Tap the Market to draw.':'Try the highlighted card.';$('info').innerHTML=G.msg}

function render(){
 var cp=$('cpu');cp.innerHTML='';var n=G.h[1].length,sh=Math.min(n,10);
 for(var i=0;i<sh;i++){var b=backEl();b.style.setProperty('--r',((i-(sh-1)/2)*5)+'deg');cp.appendChild(b)}
 var cl=$('cl');cl.className='lab'+(G.turn===1&&!G.over?' on':'');cl.innerHTML=G.cn+' · '+n+' card'+(n===1?'':'s')+(G.think?' <span class="dots"><i></i><i></i><i></i></span>':'');
 var t=topc(),key=t.s+t.n+G.disc.length;var tp=$('top');tp.innerHTML='';var te=cardEl(t,'big');if(key!==lastTop&&lastTop)te.classList.add('land');lastTop=key;tp.appendChild(te);
 $('mn').textContent=G.mkt.length+' left';
 $('chip').innerHTML='Shape '+(G.shape&&G.shape!=='whot'?'<span style="width:20px;height:20px;display:inline-flex">'+svg(G.shape)+'</span> '+G.shape:'any');
 var lv=live();$('mkt').className='back big'+(lv?' live':'');
 $('info').innerHTML=(G.pend&&G.turn===0&&!G.over?'<b>Pick '+G.pend+'.</b> '+(S.def?'Play a '+G.pn+' to defend, or tap Market.':'Tap Market to draw.')+'<br>':'')+G.msg;
 var pl=$('pl');pl.className='lab'+(lv?' on':'');pl.textContent=(S.name||'You')+' · '+G.h[0].length+' cards';
 $('hb').style.visibility=lv?'visible':'hidden';
 var me=$('me');me.innerHTML='';var nc=G.h[0].length,cw=me.clientWidth>0&&window.innerHeight<661?58:66,av=me.clientWidth-20,step=nc>1?Math.max(24,Math.min(cw+8,(av-cw)/(nc-1))):0;
 G.h[0].forEach(function(c,i){var e=cardEl(c,'','button');var can=lv&&ok(c);e.classList.add(can?'ok':'no');if(i>0)e.style.marginLeft=(step-cw)+'px';
  if(G.deal){e.classList.add('deal');e.style.animationDelay=(i*70)+'ms'}
  if(can)e.onclick=function(){humanPlay(i,e)};me.appendChild(e)});
 $('score').textContent='Wins '+S.w+' · Losses '+S.l}

function show(i){$(i).classList.add('on')}function hide(i){$(i).classList.remove('on')}
function mkt(){if(!live())return;sfx('tap');drawTurn(0)}
$('mkt').onclick=mkt;$('mkt').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();mkt()}};
$('hb').onclick=hint;
var shp=$('shapes');Object.keys(NUMS).forEach(function(s){var b=document.createElement('button');b.innerHTML='<span style="width:34px;height:34px;display:block">'+svg(s)+'</span>';b.setAttribute('aria-label',s);b.onclick=function(){G.shape=s;G.choosing=false;hide('pick');after(0,{n:20,s:'whot'})};shp.appendChild(b)});

/* ---------- settings ---------- */
function tg(k,l){return '<div class="row"><button class="btn '+(S[k]?'sel':'alt')+'" data-k="'+k+'" data-t="1">'+l+': '+(S[k]?'On':'Off')+'</button></div>'}
function opts(k,arr){return '<div class="row">'+arr.map(function(a){return '<button class="btn '+(String(S[k])===String(a[0])?'sel':'alt')+'" data-k="'+k+'" data-v="'+a[0]+'">'+a[1]+'</button>'}).join('')+'</div>'}
function menuUI(){
 var h='<h2>Settings</h2><h3>Sound</h3>'+tg('mus','Music')+opts('vol',[[.25,'Quiet'],[.5,'Medium'],[.8,'Loud']])+tg('sfx','Sound effects')+tg('vib','Vibration')
 +'<h3>Table background</h3><div class="grid">'+BGS.map(function(b,i){return '<button class="th'+(S.bg===i?' sel':'')+'" data-k="bg" data-v="'+i+'" aria-label="'+b.n+'"><span>'+b.n+'</span></button>'}).join('')+'</div>'
 +'<h3>Card back</h3><div class="bk">'+[0,1,2].map(function(i){return '<div class="back'+(S.back===i?' sel':'')+'" data-k="back" data-v="'+i+'" style="--bk:'+['repeating-linear-gradient(45deg,#a31d2e 0 6px,#8b1626 6px 12px)','repeating-linear-gradient(135deg,#1e4fb0 0 6px,#173d8a 6px 12px)','repeating-conic-gradient(#0e7a58 0 25%,#0b5f45 0 50%) 0 0/14px 14px'][i]+'"></div>'}).join('')+'</div>'
 +'<h3>Computer level</h3>'+opts('lv',[['easy','Easy'],['medium','Medium'],['hard','Hard']])
 +'<h3>Computer speed</h3>'+opts('spd',[[1.5,'Slow'],[1,'Normal'],[.6,'Fast']])
 +'<h3>Cards at the start</h3>'+opts('start',[[5,'5'],[6,'6'],[7,'7']])
 +'<h3>House rule</h3>'+tg('def','Defend pick 2 / pick 3')
 +'<h3>Your name</h3><input id="nm" maxlength="14" value="'+(S.name||'').replace(/"/g,'')+'">'
 +'<h3>Your record</h3><p>'+S.w+' wins, '+S.l+' losses. <button class="btn alt" data-r="1">Reset</button></p>'
 +'<details><summary><b>How to play</b></summary><ul><li>Play a card that matches the top card\'s <b>shape</b> or <b>number</b>.</li><li>No match? Tap the <b>Market</b> to draw 1 card. Your turn then ends.</li><li><b>1</b> Hold on and <b>8</b> Suspension: play again.</li><li><b>2</b> Pick two, <b>5</b> Pick three. With defend on, answer with the same number to pass it back.</li><li><b>14</b> General market: the other player draws 1, you play again.</li><li><b>20 Whot</b> plays on anything and lets you choose the shape.</li><li>Be first to finish all your cards. Use <b>Hint</b> if you are stuck.</li></ul></details>'
 +'<div class="row" style="margin-top:14px"><button class="btn" data-n="1">New game</button><button class="btn alt" data-c="1">Close</button></div>';
 $('sheet').innerHTML=h;[].forEach.call(document.querySelectorAll('.th'),function(t,i){t.style.background=BGS[i].c});var nm=$('nm');nm.onchange=function(){S.name=nm.value.trim()||'You';save();render()}}
$('sheet').addEventListener('click',function(e){var b=e.target.closest('[data-k],[data-n],[data-c],[data-r]');if(!b)return;sfx('tap');
 if(b.dataset.n){return newGame()}if(b.dataset.c){return hide('menu')}if(b.dataset.r){S.w=0;S.l=0;save();menuUI();return render()}
 var k=b.dataset.k;if(b.dataset.t)S[k]=!S[k];else{var v=b.dataset.v;S[k]=(v!==''&&!isNaN(v))?Number(v):v}
 save();if(k==='mus'){S.mus?musicOn():musicOff()}if(k==='vol'&&MG)MG.gain.value=S.vol*.7;
 applyBg();var sc=$('sheet').scrollTop;menuUI();$('sheet').scrollTop=sc;render()});
$('mb').onclick=function(){menuUI();show('menu')};$('again').onclick=newGame;
window.addEventListener('resize',function(){if(G)render()});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
applyBg();newGame();
})();
</script></body></html>
