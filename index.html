<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14123a">
<meta name="description" content="Playora: free games for everyone. Racing, board and card games, word games, puzzles and more. Play instantly on any phone or computer.">
<title>Playora - Free games for everyone</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14123a;--panel:#211e55;--panel2:#2b2870;--line:#ffffff1f;--text:#f6f3ff;--muted:#b3afe0;--hot:#ff5a36;
--disp:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);min-height:100%}
body{padding:env(safe-area-inset-top,0) 0 0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid #ffc21a;outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:680px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 92px)}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:var(--disp);font-weight:800;font-size:27px;letter-spacing:-.5px}
.brand small{display:block;font-size:12px;color:var(--muted);margin-top:-2px}
#mus{width:46px;height:46px;border-radius:15px;background:#ffffff1a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
#mus svg{width:22px;height:22px}
#mus[aria-pressed=false]{opacity:.65}

/* hero: the one big moment */
.pn{font-family:var(--disp);font-weight:800;font-size:23px;margin:4px 0 12px}
.pgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.pgrid{grid-template-columns:1fr 1fr}}
.hero{position:relative;display:block;width:100%;height:210px;border-radius:26px;overflow:hidden;text-align:left;background:linear-gradient(#2d1b69,#ff7a59 62%,#ffd9a0);isolation:isolate;box-shadow:0 14px 40px #0006}
.sun{position:absolute;left:64%;top:30%;width:84px;height:84px;border-radius:50%;background:#fff1c9;box-shadow:0 0 70px #fff8;z-index:-3}
.sky{position:absolute;left:0;right:0;bottom:46%;width:100%;height:38%;z-index:-2}
.ground{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(#9b9db0,#80829a);overflow:hidden;z-index:-1}
.road{position:absolute;inset:0;background:#555869;clip-path:polygon(49.9% 0,50.1% 0,118% 100%,-18% 100%)}
.sl{position:absolute;left:0;right:0;top:12px;height:4px;transform-origin:50% -12px;opacity:0;animation:sl 1.6s linear infinite}
.sl::before,.sl::after{content:"";position:absolute;top:0;height:100%;width:1.5%;background:var(--rc)}
.sl::before{left:41.7%}.sl::after{left:56.8%}
.sl i{position:absolute;left:49.7%;width:.6%;top:0;height:100%;background:#f4f1ea}
.sl:nth-child(odd){--rc:#d9304a}.sl:nth-child(even){--rc:#f4f1ea}
.sl:nth-child(2){animation-delay:-.2s}.sl:nth-child(3){animation-delay:-.4s}.sl:nth-child(4){animation-delay:-.6s}.sl:nth-child(5){animation-delay:-.8s}.sl:nth-child(6){animation-delay:-1s}.sl:nth-child(7){animation-delay:-1.2s}.sl:nth-child(8){animation-delay:-1.4s}
@keyframes sl{0%{transform:scale(1);opacity:0}4%{opacity:1}25%{transform:scale(1.29)}50%{transform:scale(1.82)}75%{transform:scale(3.08)}90%{transform:scale(5.3)}100%{transform:scale(10);opacity:1}}
.hcar{position:absolute;left:50%;bottom:8px;width:112px;margin-left:-56px}
.htxt{position:absolute;left:18px;top:16px;right:18px}
.tag{display:inline-block;font-size:12px;font-weight:700;background:#0005;border-radius:20px;padding:4px 10px;letter-spacing:.2px}
.htxt h2{font-family:var(--disp);font-weight:800;font-style:italic;font-size:38px;line-height:1;margin:0 0 6px;text-shadow:0 3px 14px #0006}
.htxt p{margin:0;font-size:14px;font-weight:600;text-shadow:0 1px 8px #0008}
.go{position:absolute;left:18px;bottom:16px;background:var(--hot);color:#fff;font-family:var(--disp);font-weight:800;font-size:16px;border-radius:14px;padding:11px 16px;box-shadow:0 4px 0 #b3361b}

/* whot card */
.hero.whot{background:radial-gradient(120% 90% at 70% 110%,#16a37a,#0a3b2f 70%)}
.fan{position:absolute;right:14px;bottom:-14px;width:170px;height:140px}
.fan i{position:absolute;bottom:0;left:50%;width:70px;height:104px;margin-left:-35px;border-radius:10px;background:linear-gradient(145deg,#fffefa,#f2e8cc);box-shadow:0 6px 14px #0007;transform-origin:50% 130%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--disp);font-weight:800;font-size:28px}
.fan i:nth-child(1){transform:rotate(-24deg);color:#d7263d}
.fan i:nth-child(2){transform:rotate(-4deg);color:#1e4fb0}
.fan i:nth-child(3){transform:rotate(16deg);color:#fff;background:linear-gradient(150deg,#c8102e,#7a0a1c);font-size:20px;color:#ffd36b}
.hero.whot .go{background:#f2b134;color:#2a1d12;box-shadow:0 4px 0 #a97a14}
#gerr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:var(--bg);z-index:2}
#gerr b{font-family:var(--disp);font-size:24px}
#gerr p{margin:0;color:var(--muted);max-width:320px}
#gerr .row{display:flex;gap:10px}
#gerr button{background:var(--hot);color:#fff;font-weight:800;border-radius:14px;padding:12px 18px}
#gerr button.alt{background:#ffffff22}
/* category chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 4px;padding:4px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:22px;background:#ffffff14;border:1px solid var(--line);font-weight:700;font-size:14px}
.chip[aria-pressed=true]{background:var(--text);color:#14123a;border-color:var(--text)}

/* sections */
.cat{margin-top:26px}
.cat h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0 0 10px;font-family:var(--disp);font-weight:800;font-size:23px}
.cat h3 i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);transform:translateY(1px)}
.cat h3 span{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;text-align:left;border-radius:20px;padding:12px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile .ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#ffffff26}
.tile b{font-family:var(--disp);font-weight:800;font-size:17px;line-height:1.15;display:block}
.tile small{font-size:12.5px;font-weight:600;opacity:.85}
.tile.live{background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#14123a));box-shadow:0 8px 20px #0004;color:#fff}
.tile.live:active{transform:scale(.97)}
.tile.soon{background:transparent;border:1.5px dashed #ffffff33;color:var(--muted)}
.tile.soon .ic{background:#ffffff10;filter:grayscale(.6);opacity:.8}
.tile.soon b{color:#d9d6f5}
.empty{border:1.5px dashed #ffffff33;border-radius:20px;padding:20px;color:var(--muted);font-size:14px}

/* diary */
.diary h2{font-family:var(--disp);font-size:30px;font-weight:800;margin:12px 0 4px}
.diary p.sub{color:var(--muted);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border-radius:18px;padding:12px;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--disp);font-size:28px;font-weight:800}
.stat span{font-size:12.5px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.log b{display:block;font-weight:700}
.log span{font-size:13px;color:var(--muted)}
.log time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.clr{margin-top:18px;color:var(--muted);text-decoration:underline;font-size:14px}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(180deg,#14123a00,#14123a 38%);z-index:5}
nav .in{display:flex;gap:6px;background:#26235a;border:1px solid var(--line);border-radius:22px;padding:5px;width:min(100%,340px)}
nav button{flex:1;padding:11px;border-radius:17px;font-weight:700;color:var(--muted)}
nav button[aria-current=page]{background:var(--text);color:#14123a}

/* game stage */
#stage{position:fixed;inset:0;background:#000;z-index:20}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
/* games are landscape: if the phone is still upright and can't be locked, turn the game sideways so it fills the screen */
#stage.rot{inset:auto;top:0;left:100%;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0;transform:rotate(90deg)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:#fff;color:#14123a;font-weight:700;border-radius:14px;padding:11px 16px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.sl{animation:none;opacity:1}}
</style></head>
<body>
<div id="app">

  <div class="brand">

 <main id="home">

   <svg class="sky" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true"><g fill="#6a3f86"><rect x="0" y="40" width="30" height="60"/><rect x="34" y="20" width="22" height="80"/><rect x="60" y="48" width="34" height="52"/><rect x="98" y="30" width="20" height="70"/><rect x="122" y="52" width="40" height="48"/><rect x="170" y="14" width="24" height="86"/><rect x="198" y="44" width="30" height="56"/><rect x="232" y="34" width="26" height="66"/><rect x="262" y="54" width="36" height="46"/><rect x="302" y="24" width="22" height="76"/><rect x="328" y="46" width="34" height="54"/><rect x="366" y="32" width="34" height="68"/></g></svg>

    <polygon points="13,18 25,0.5 75,0.5 87,18" fill="#c92b27"/><polygon points="19,16.5 28,4.5 72,4.5 81,16.5" fill="url(#hw)"/><polygon points="30,5 38,5 30,16 23,16" fill="#fff" opacity=".22"/>
    <rect x="3" y="25.5" width="25" height="8.5" rx="3.5" fill="#ff3030"/><rect x="72" y="25.5" width="25" height="8.5" rx="3.5" fill="#ff3030"/><rect x="6" y="27" width="19" height="3" rx="1.5" fill="#ffd0c8"/><rect x="75" y="27" width="19" height="3" rx="1.5" fill="#ffd0c8"/>
    <rect x="0" y="40" width="100" height="11.5" rx="5" fill="#6c1614"/><rect x="40.5" y="32" width="19" height="7.5" rx="1.2" fill="#f1f1e8"/><circle cx="22" cy="51" r="3.5" fill="#24242c"/><circle cx="78" cy="51" r="3.5" fill="#24242c"/></svg>
   <div class="htxt"><h2>Car Race</h2><p>5 tracks, 12 cars to unlock</p></div>

  </button>

  <button class="hero whot" id="hero2" aria-label="Play Whot">

 <div id="gerr" hidden><b>Could not open this game</b><p id="gmsg">Check your connection and try again.</p><div class="row"><button id="gretry">Try again</button><button class="alt" id="gback">Back</button></div></div></div>
<div id="toast" role="status"></div>
<audio id="bgm" src="music1.mp3" loop preload="none"></audio>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};

/* ---- the catalogue: add a file name to make a game playable ---- */
var CATS=[
 {id:'racing',name:'Racing',c:'#ff5a36',games:[
  {n:'Car Race',e:'🏎️',d:'5 tracks, 12 cars',f:'games/car-race.html',o:'landscape'},
  {n:'Bike Race',e:'🏍️',d:'Lean into the turns'},
  {n:'Drift Challenge',e:'💨',d:'Slide for points'},
  {n:'Traffic Dodge',e:'🚦',d:'Weave through cars'}]},
 {id:'board',name:'Board & Cards',c:'#12a875',games:[
  {n:'Whot',e:'🃏',d:'Classic card game',f:'games/whot.html',o:'portrait'},
  {n:'Chess',e:'♟️',d:'Play the computer'},
  {n:'Ludo',e:'🎲',d:'Race your tokens home'},
  {n:'Checkers',e:'⚫',d:'Jump and capture'},
  {n:'Crazy Cards',e:'🎴',d:'Match colors and numbers'}]},
 {id:'word',name:'Word & Trivia',c:'#8b5cf6',games:[
  {n:'Word Circle',e:'🔤',d:'Swipe letters to make words'},
  {n:'Word Guess',e:'🟩',d:'Daily 5-letter puzzle'},
  {n:'Mini Crossword',e:'✏️',d:'Quick clues'},
  {n:'Quiz Challenge',e:'🧠',d:'Test your knowledge'},
  {n:'Flag Quiz',e:'🚩',d:'Name the country'}]},
 {id:'puzzle',name:'Puzzle',c:'#0fa3c9',games:[
  {n:'Gem Match',e:'💎',d:'Match 3 or more'},
  {n:'Block Puzzle',e:'🧱',d:'Fit the shapes'},
  {n:'Bubble Shooter',e:'🫧',d:'Pop matching bubbles'},
  {n:'Number Merge',e:'🔢',d:'Combine to grow'},
  {n:'Sudoku',e:'🔳',d:'Fill the grid'}]},
 {id:'arcade',name:'Arcade & Action',c:'#f2a100',games:[
  {n:'Endless Runner',e:'🏃',d:'Run, jump, slide'},
  {n:'Fruit Slice',e:'🍉',d:'Swipe to slice'},
  {n:'Stack Tower',e:'🏗️',d:'Build it high'},
  {n:'Flappy Wings',e:'🐦',d:'Tap to fly'}]},
 {id:'football',name:'Football',c:'#5aae1a',games:[
  {n:'Penalty Shootout',e:'⚽',d:'Beat the keeper'},
  {n:'Free Kick',e:'🥅',d:'Bend it over the wall'},
  {n:'Keepie Uppie',e:'🦶',d:'Never let it drop'}]},
 {id:'sports',name:'Sports',c:'#3b82f6',games:[]}
];

/* ---- storage ---- */
function get(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---- toast ---- */
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1800)}

/* ---- home ---- */
var filter='all';
function renderChips(){var el=$('chips');el.innerHTML='';
 [{id:'all',name:'All'}].concat(CATS).forEach(function(c){var b=document.createElement('button');b.className='chip';b.textContent=c.name;b.setAttribute('aria-pressed',filter===c.id?'true':'false');b.onclick=function(){filter=c.id;renderChips();renderCats()};el.appendChild(b)})}
function renderCats(){var el=$('cats');el.innerHTML='';
 CATS.forEach(function(c){if(filter!=='all'&&filter!==c.id)return;
  var live=c.games.filter(function(g){return g.f}).length,sec=document.createElement('section');sec.className='cat';sec.style.setProperty('--c',c.c);
  var h=document.createElement('h3');h.innerHTML='<i></i>'+c.name+'<span>'+(c.games.length?(live?live+' ready, '+(c.games.length-live)+' coming soon':'Coming soon'):'Coming soon')+'</span>';sec.appendChild(h);
  if(!c.games.length){var e=document.createElement('div');e.className='empty';e.textContent='No games here yet. This category is on the way.';sec.appendChild(e)}
  else{var g=document.createElement('div');g.className='grid';
   c.games.forEach(function(x){var b=document.createElement('button');b.className='tile '+(x.f?'live':'soon');
    b.innerHTML='<span class="ic" aria-hidden="true">'+x.e+'</span><span><b>'+x.n+'</b><small>'+(x.f?'Play now':'Coming soon')+'</small></span>';
    b.setAttribute('aria-label',x.n+(x.f?'':', coming soon'));
    b.onclick=function(){x.f?openGame(x):toast(x.n+' is coming soon')};g.appendChild(b)});
   sec.appendChild(g)}
  el.appendChild(sec)})}

/* ---- music: plays on the home screen only, never inside a game ---- */
var bgm=$('bgm'),musOn=get('playora-music',true),started=false,inGame=false;
function musUI(){var b=$('mus');b.setAttribute('aria-pressed',musOn?'true':'false');b.setAttribute('aria-label',musOn?'Turn music off':'Turn music on')}
function playMusic(){if(!musOn||inGame||document.hidden)return;var p=bgm.play();if(p&&p.catch)p.catch(function(){started=false})}
$('mus').onclick=function(){musOn=!musOn;set('playora-music',musOn);musUI();if(musOn){started=true;playMusic()}else bgm.pause()};
function firstTap(){if(started)return;started=true;playMusic()}
document.addEventListener('pointerdown',firstTap,{passive:true});
document.addEventListener('visibilitychange',function(){if(document.hidden)bgm.pause();else playMusic()});

/* ---- games open inside the app, music stops while playing ---- */
var cur=null,pushed=false,openTok=0;
function isPortrait(){return window.innerHeight>window.innerWidth}
function wantLand(){return !!cur&&cur.o!=='portrait'}
/* racing is played sideways: if the phone is still upright and can't be locked, turn the stage so it fills the screen. Card games stay upright. */
function fitStage(){var st=$('stage');if(st.hidden)return;st.classList.toggle('rot',wantLand()&&isPortrait())}
function goFull(land){var de=document.documentElement;
 try{var p=de.requestFullscreen?de.requestFullscreen({navigationUI:'hide'}):(de.webkitRequestFullscreen&&de.webkitRequestFullscreen());
  var lock=function(){try{if(land)screen.orientation.lock('landscape').catch(function(){});else screen.orientation.unlock()}catch(e){}};
  if(p&&p.then)p.then(lock).catch(lock);else lock()}catch(e){}
 fitStage()}
function leaveFull(){try{screen.orientation.unlock()}catch(e){}try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}$('stage').classList.remove('rot')}
window.addEventListener('resize',fitStage);window.addEventListener('orientationchange',function(){setTimeout(fitStage,150)});

/* Work out where the game file really is. This fixes the 404 you get when the site is opened
   without a trailing slash (for example /playora) or from a sub-folder, where "games/x.html" points at the wrong place. */
function dirOf(path){if(/\/$/.test(path))return path;var last=path.split('/').pop();return /\.[a-z0-9]+$/i.test(last)?path.slice(0,path.length-last.length):path+'/'}
function candidates(f){var o=location.origin,d=dirOf(location.pathname),list=[o+d+f,o+'/'+f,o+'/playora/'+f,new URL(f,document.baseURI).href],seen={};
 return list.filter(function(u){if(seen[u])return false;seen[u]=1;return true})}
function probe(u){return fetch(u,{cache:'no-store'}).then(function(r){return r.ok?u:Promise.reject(u)})}
function resolveGame(f){
 if(location.protocol==='file:')return Promise.resolve(f);
 var list=candidates(f),i=0;
 return new Promise(function(ok,bad){(function next(){if(i>=list.length)return bad();probe(list[i++]).then(ok,next)})()})}

function showErr(g,msg){$('gmsg').textContent=msg||('We could not find '+g.n+'. Check your connection and try again.');$('gerr').hidden=false}
function loadGame(g){var tok=++openTok;$('gerr').hidden=true;$('frame').src='about:blank';
 resolveGame(g.f).then(function(u){if(tok!==openTok||!cur)return;$('frame').src=u},function(){if(tok!==openTok||!cur)return;showErr(g)})}
function openGame(g){cur=g;inGame=true;bgm.pause();$('stage').hidden=false;document.body.style.overflow='hidden';goFull(g.o!=='portrait');loadGame(g);
 try{history.pushState({g:g.n},'');pushed=true}catch(e){pushed=false}}
function closeGame(fromPop){if(!cur)return;openTok++;leaveFull();$('stage').hidden=true;$('gerr').hidden=true;$('frame').src='about:blank';document.body.style.overflow='';cur=null;inGame=false;
 if(pushed&&!fromPop){pushed=false;try{history.back()}catch(e){}}else pushed=false;
 playMusic()}
window.addEventListener('popstate',function(){if(cur)closeGame(true)});
$('gretry').onclick=function(){if(cur)loadGame(cur)};$('gback').onclick=function(){closeGame()};
function byFile(f){for(var i=0;i<CATS.length;i++)for(var j=0;j<CATS[i].games.length;j++)if(CATS[i].games[j].f===f)return CATS[i].games[j]}
$('hero').onclick=function(){openGame(byFile('games/car-race.html'))};
$('hero2').onclick=function(){openGame(byFile('games/whot.html'))};

/* ---- diary ---- */
function log(game,text){var l=get('playora-log',[]);l.unshift({g:game,t:text,ts:Date.now()});set('playora-log',l.slice(0,100))}
window.addEventListener('message',function(e){if(e.source!==$('frame').contentWindow)return;var d=e.data||{};
 if(d.type==='playora:exit')closeGame();else if(d.type==='playora:result'&&d.game)log(String(d.game).slice(0,40),String(d.text||'').slice(0,120))});
function ago(ts){var s=(Date.now()-ts)/1000;if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';var d=Math.floor(s/86400);return d===1?'Yesterday':d+' days ago'}
function renderDiary(){var l=get('playora-log',[]),counts={},fav='-',max=0;
 l.forEach(function(x){counts[x.g]=(counts[x.g]||0)+1;if(counts[x.g]>max){max=counts[x.g];fav=x.g}});
 $('stats').innerHTML='<div class="stat"><b>'+l.length+'</b><span>Games logged</span></div><div class="stat"><b>'+Object.keys(counts).length+'</b><span>Different games</span></div><div class="stat"><b style="font-size:19px;padding-top:7px">'+fav+'</b><span>Most played</span></div>';
 var ul=$('log');ul.innerHTML='';
 if(!l.length){ul.innerHTML='<li><div><b>Nothing here yet</b><span>Finish a game and it shows up here.</span></div></li>'}
 l.forEach(function(x){var li=document.createElement('li');li.innerHTML='<div><b></b><span></span></div><time></time>';li.querySelector('b').textContent=x.g;li.querySelector('span').textContent=x.t;li.querySelector('time').textContent=ago(x.ts);ul.appendChild(li)});
 $('clr').hidden=!l.length}
$('clr').onclick=function(){if(confirm('Clear all diary entries?')){set('playora-log',[]);renderDiary()}};

function tab(t){var d=t==='diary';$('home').hidden=d;$('diary').hidden=!d;$('tg').setAttribute('aria-current',d?'false':'page');$('td').setAttribute('aria-current',d?'page':'false');if(d)renderDiary();window.scrollTo(0,0)}
$('tg').onclick=function(){tab('games')};$('td').onclick=function(){tab('diary')};

musUI();renderChips();renderCats();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
